services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      DATABASE_PATH: /data/agrivision.sqlite3
    volumes:
      - agrivision_data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  agrivision_data:
